[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-market-lab3"
version = "0.1.0"
description = "Transactional campus second-hand market course prototype"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
campus-market = "campus_market.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
